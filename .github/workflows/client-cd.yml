name: Client CD

on:
  push:
    branches: [main]
    paths:
      - 'vulv/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/vulv-client

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: vulv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e

            # Create external network if not exists
            docker network create vulv-network 2>/dev/null || true

            # Stop and remove existing container
            docker stop vulv-client 2>/dev/null || true
            docker rm vulv-client 2>/dev/null || true

            # Login to GHCR and pull latest image
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ${{ env.IMAGE_NAME }}:latest

            # Run the new container
            docker run -d \
              --name vulv-client \
              --network vulv-network \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:latest

            echo "✅ Deployed vulv-client successfully"