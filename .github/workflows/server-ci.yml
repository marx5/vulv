name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'vulv-server/**'
  pull_request:
    branches: [main]
    paths:
      - 'vulv-server/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: vulv-server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vulv-server

      - name: Run build
        run: npm run build
        working-directory: vulv-server

      - name: Run tests (if available)
        run: npm test --if-present
        working-directory: vulv-server