name: Server CD

on:
  push:
    branches: [main]
    paths:
      - 'vulv-server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Server to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e

            echo "⚠️ Server deployment workflow is a placeholder."
            echo "Repository does not contain a 'vulv-server' directory."
            echo "This workflow will be triggered when server code is added."